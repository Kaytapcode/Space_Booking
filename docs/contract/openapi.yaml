              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000001/checkout, code: INTERNAL_ERROR}}}
  /api/v1/bookings/{bookingId}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    patch:
      tags: [Bookings]
      operationId: cancelBooking
      summary: PENDING or CONFIRMED -> CANCELLED before start
      x-roles: [EMPLOYEE, MANAGER]
      x-ownership: owner only
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingResponse'}
              examples: {BookingCancelled: {$ref: '#/components/examples/BookingCancelled'}}
        '400':
          description: '`VALIDATION_FAILED`: request shape or field validation failed (see errors[]).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {ValidationFailed: {summary: VALIDATION_FAILED, value: {type: about:blank, title: Bad Request, status: 400, detail: Request validation failed., instance: /api/v1/bookings/not-a-uuid/cancel, code: VALIDATION_FAILED, errors: [{field: bookingId, message: must be a valid UUID}]}}}
        '401':
          description: '`UNAUTHENTICATED`: missing, malformed, tampered or expired token.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {Unauthenticated: {summary: UNAUTHENTICATED, value: {type: about:blank, title: Unauthorized, status: 401, detail: Authentication is required., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000001/cancel, code: UNAUTHENTICATED}}}
        '403':
          description: '`ACCESS_DENIED`: role not allowed, or caller is not the owner.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {AccessDenied: {summary: ACCESS_DENIED, value: {type: about:blank, title: Forbidden, status: 403, detail: Only the owner of this booking can do this., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000001/cancel, code: ACCESS_DENIED}}}
        '404':
          description: '`BOOKING_NOT_FOUND`: booking does not exist.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {BookingNotFound: {summary: BOOKING_NOT_FOUND, value: {type: about:blank, title: Not Found, status: 404, detail: Booking not found., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000009/cancel, code: BOOKING_NOT_FOUND}}}
        '409':
          description: '`INVALID_STATE_TRANSITION`: action not allowed in the current booking status. `BOOKING_ALREADY_STARTED`: action only allowed before start_time. `CONCURRENT_UPDATE`: a concurrent change won (optimistic version or lock timeout); reload and retry.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InvalidStateTransition: {summary: INVALID_STATE_TRANSITION, value: {type: about:blank, title: Conflict, status: 409, detail: Cannot cancel a booking in status CHECKED_IN., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000001/cancel, code: INVALID_STATE_TRANSITION}}, BookingAlreadyStarted: {summary: BOOKING_ALREADY_STARTED, value: {type: about:blank, title: Conflict, status: 409, detail: The booking has already started., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000001/cancel, code: BOOKING_ALREADY_STARTED}}, ConcurrentUpdate: {summary: CONCURRENT_UPDATE, value: {type: about:blank, title: Conflict, status: 409, detail: The booking is being changed by another request; reload and retry., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000001/cancel, code: CONCURRENT_UPDATE}}}
        '500':
          description: '`INTERNAL_ERROR`: unexpected server error; no stack trace is exposed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000001/cancel, code: INTERNAL_ERROR}}}
  /api/v1/bookings/{bookingId}/logs:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Audit]
      operationId: getBookingLogs
      summary: Audit trail of one booking, oldest first
      x-roles: [EMPLOYEE, MANAGER, ADMIN]
      x-ownership: EMPLOYEE only for own bookings; MANAGER and ADMIN for any booking
      responses:
        '200':
          description: Audit entries.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AuditLogResponse'}}
              examples: {BookingLogs: {$ref: '#/components/examples/BookingLogs'}}
        '400':
          description: '`VALIDATION_FAILED`: request shape or field validation failed (see errors[]).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {ValidationFailed: {summary: VALIDATION_FAILED, value: {type: about:blank, title: Bad Request, status: 400, detail: Request validation failed., instance: /api/v1/bookings/not-a-uuid/logs, code: VALIDATION_FAILED, errors: [{field: bookingId, message: must be a valid UUID}]}}}
        '401':
          description: '`UNAUTHENTICATED`: missing, malformed, tampered or expired token.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {Unauthenticated: {summary: UNAUTHENTICATED, value: {type: about:blank, title: Unauthorized, status: 401, detail: Authentication is required., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000001/logs, code: UNAUTHENTICATED}}}
        '403':
          description: '`ACCESS_DENIED`: role not allowed, or caller is not the owner.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {AccessDenied: {summary: ACCESS_DENIED, value: {type: about:blank, title: Forbidden, status: 403, detail: You can only view logs of your own bookings., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000001/logs, code: ACCESS_DENIED}}}
        '404':
          description: '`BOOKING_NOT_FOUND`: booking does not exist.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {BookingNotFound: {summary: BOOKING_NOT_FOUND, value: {type: about:blank, title: Not Found, status: 404, detail: Booking not found., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000009/logs, code: BOOKING_NOT_FOUND}}}
        '500':
          description: '`INTERNAL_ERROR`: unexpected server error; no stack trace is exposed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/bookings/bbbbbbbb-0000-4000-8000-000000000001/logs, code: INTERNAL_ERROR}}}
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      operationId: searchAuditLogs
      summary: Global audit log, newest first
      description: '`from`/`to` are inclusive dates in Asia/Ho_Chi_Minh; `from` must not be after `to`.'
      x-roles: [ADMIN]
      parameters:
        - name: bookingId
          in: query
          schema:
            type: string
            format: uuid
          example: bbbbbbbb-0000-4000-8000-000000000002
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/AuditAction'
          example: APPROVED
        - name: from
          in: query
          schema:
            type: string
            format: date
          example: '2026-11-01'
        - name: to
          in: query
          schema:
            type: string
            format: date
          example: '2026-11-30'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of audit entries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogPage'}
              examples: {AuditLogPage: {$ref: '#/components/examples/AuditLogPage'}}
        '400':
          description: '`VALIDATION_FAILED`: request shape or field validation failed (see errors[]).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {ValidationFailed: {summary: VALIDATION_FAILED, value: {type: about:blank, title: Bad Request, status: 400, detail: Request validation failed., instance: /api/v1/audit-logs?from=2026-11-30&to=2026-11-01, code: VALIDATION_FAILED, errors: [{field: from, message: must not be after to}]}}}
        '401':
          description: '`UNAUTHENTICATED`: missing, malformed, tampered or expired token.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {Unauthenticated: {summary: UNAUTHENTICATED, value: {type: about:blank, title: Unauthorized, status: 401, detail: Authentication is required., instance: /api/v1/audit-logs, code: UNAUTHENTICATED}}}
        '403':
          description: '`ACCESS_DENIED`: role not allowed, or caller is not the owner.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {AccessDenied: {summary: ACCESS_DENIED, value: {type: about:blank, title: Forbidden, status: 403, detail: Only administrators can read the audit log., instance: /api/v1/audit-logs, code: ACCESS_DENIED}}}
        '500':
          description: '`INTERNAL_ERROR`: unexpected server error; no stack trace is exposed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/audit-logs, code: INTERNAL_ERROR}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
