  schemas:
    Role:
      type: string
      enum: [EMPLOYEE, MANAGER, ADMIN]
    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW]
    AuditAction:
      type: string
      enum: [CREATED, APPROVED, REJECTED, CANCELLED, EXPIRED, CHECKED_IN, CHECKED_OUT, COMPLETED, NO_SHOW]
    ErrorCode:
      type: string
      description: |
        Stable error-code catalog.

        | Code | HTTP | Meaning |
        |---|---|---|
        | VALIDATION_FAILED | 400 | request shape or field validation failed (see errors[]) |
        | START_IN_PAST | 400 | startTime is before the current minute |
        | DURATION_EXCEEDED | 400 | EMPLOYEE booking longer than 120 minutes |
        | UNAUTHENTICATED | 401 | missing, malformed, tampered or expired token |
        | INVALID_CREDENTIALS | 401 | unknown email or wrong password |
        | ACCESS_DENIED | 403 | role not allowed, or caller is not the owner |
        | ROOM_NOT_FOUND | 404 | room does not exist, or is inactive for a non-admin |
        | BOOKING_NOT_FOUND | 404 | booking does not exist |
        | EMAIL_ALREADY_EXISTS | 409 | email already registered (case-insensitive) |
        | ROOM_NAME_ALREADY_EXISTS | 409 | another room has this name |
        | ROOM_HAS_FUTURE_BOOKINGS | 409 | room has blocking bookings ending in the future |
        | CONCURRENT_UPDATE | 409 | a concurrent change won (optimistic version or lock timeout); reload and retry |
        | BOOKING_CONFLICT | 409 | slot overlaps a blocking booking, or lost the concurrent race |
        | INVALID_STATE_TRANSITION | 409 | action not allowed in the current booking status |
        | BOOKING_ALREADY_STARTED | 409 | action only allowed before start_time |
        | OUTSIDE_CHECKIN_WINDOW | 409 | check-in only from start-15m to start+15m |
        | INTERNAL_ERROR | 500 | unexpected server error; no stack trace is exposed |
        | REQUEST_NOT_SUPPORTED | 404/405/415 | unknown route, wrong method or unsupported media type (framework level, not declared per operation) |
      enum: [VALIDATION_FAILED, START_IN_PAST, DURATION_EXCEEDED, UNAUTHENTICATED, INVALID_CREDENTIALS, ACCESS_DENIED, ROOM_NOT_FOUND, BOOKING_NOT_FOUND, EMAIL_ALREADY_EXISTS, ROOM_NAME_ALREADY_EXISTS, ROOM_HAS_FUTURE_BOOKINGS, CONCURRENT_UPDATE, BOOKING_CONFLICT, INVALID_STATE_TRANSITION, BOOKING_ALREADY_STARTED, OUTSIDE_CHECKIN_WINDOW, INTERNAL_ERROR, REQUEST_NOT_SUPPORTED]
    EquipmentToken:
      type: string
      pattern: ^[a-z0-9-]{1,24}$
      example: whiteboard
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Stored lower-cased.
        password:
          type: string
          minLength: 8
          maxLength: 72
        fullName:
          type: string
          minLength: 1
          maxLength: 100
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 72
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds until expiry.
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      required: [id, email, fullName, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    UserSummary:
      type: object
      description: Public view of a user; never includes email.
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
    RoomRequest:
      type: object
      additionalProperties: false
      required: [name, location, capacity, equipments, requiresApproval]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        location:
          type: string
          minLength: 1
          maxLength: 255
        capacity:
          type: integer
          minimum: 1
          maximum: 1000
        equipments:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EquipmentToken'
        requiresApproval:
          type: boolean
        active:
          type: boolean
          description: 'Ignored on create (rooms start active). On update: omitted = unchanged, false deactivates (same guard as DELETE), true reactivates.'
    RoomResponse:
      type: object
      required: [id, name, location, capacity, equipments, requiresApproval, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
        capacity:
          type: integer
        equipments:
          type: array
          description: Sorted ascending.
          items:
            $ref: '#/components/schemas/EquipmentToken'
        requiresApproval:
          type: boolean
        active:
          type: boolean
    RoomSummary:
      type: object
      required: [id, name, location]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
    BookingRequest:
      type: object
      additionalProperties: false
      required: [roomId, title, startTime, endTime]
      properties:
        roomId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 255
        startTime:
          type: string
          format: date-time
          description: Whole minute; not before the current minute.
        endTime:
          type: string
          format: date-time
          description: Whole minute; after startTime.
    RejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
          description: Blank after trim is invalid.
    BookingResponse:
      type: object
      required: [id, room, user, title, startTime, endTime, status, rejectionReason, createdAt]
      properties:
        id:
          type: string
          format: uuid
        room:
          $ref: '#/components/schemas/RoomSummary'
        user:
          $ref: '#/components/schemas/UserSummary'
        title:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BookingStatus'
        rejectionReason:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    ScheduleBookingResponse:
      type: object
      required: [id, title, startTime, endTime, status, user]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, CONFIRMED, CHECKED_IN]
        user:
          $ref: '#/components/schemas/UserSummary'
    RoomScheduleResponse:
      type: object
      required: [room, bookings]
      properties:
        room:
          $ref: '#/components/schemas/RoomResponse'
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleBookingResponse'
    DailyScheduleResponse:
      type: object
      required: [date, rooms]
      properties:
        date:
          type: string
          format: date
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomScheduleResponse'
    AuditLogResponse:
      type: object
      required: [id, bookingId, action, performedBy, details, createdAt]
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/AuditAction'
        performedBy:
          type: string
          description: Actor email, or SYSTEM_SCHEDULER.
        details:
          type: string
          description: 'JSON text: {"from","to"} plus "reason" or "endTime" when relevant.'
        createdAt:
          type: string
          format: date-time
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    BookingPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: {$ref: '#/components/schemas/BookingResponse'}
    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: {$ref: '#/components/schemas/AuditLogResponse'}
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ProblemDetail:
      type: object
      description: RFC 7807 problem with a stable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          description: Present only for VALIDATION_FAILED.
          items:
            $ref: '#/components/schemas/FieldError'
