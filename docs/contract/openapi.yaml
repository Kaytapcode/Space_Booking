# SpaceBooking API contract (frozen after GATE 1). Error responses are declared per operation; ErrorCode holds the catalog.
openapi: 3.1.0
info:
  title: SpaceBooking API
  version: 1.0.0
  summary: Internal meeting-room booking by time slot without conflicts.
  description: |
    Frozen contract. Business rules live in `domain.md`; this file defines shapes and status codes.
    - Every operation lists its allowed roles in `x-roles` (`PUBLIC` = no token).
    - Times are ISO-8601 `date-time`. Requests may carry any offset; responses are UTC (`Z`).
      Booking times must be whole minutes (seconds and fractions = 0).
    - Errors are RFC 7807 `application/problem+json` with a stable `code` from `ErrorCode`.
    - Check order: 401 -> 403 (role) -> 400 (request shape, incl. malformed path UUIDs) -> 404 -> 403 (ownership) -> 409/400 (state and business guards).
    - Every operation declares each status it can return, with one example per error `code`. Malformed JSON, wrong types and missing parameters are 400 `VALIDATION_FAILED`.
    - Outside the operations: unknown route (404), wrong method (405) and unsupported media type (415) return a ProblemDetail with `REQUEST_NOT_SUPPORTED`.
    - Public operations (`security: []`) ignore any `Authorization` header.
    - List sort orders and tie-breakers: domain.md section 10.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same origin
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Registration, login and current user.
  - name: Rooms
    description: Room catalog and search.
  - name: Bookings
    description: Booking lifecycle and schedules.
  - name: Audit
    description: Audit trail.
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a new EMPLOYEE account and log in
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: an.nguyen@company.vn
              password: Matkhau@2026
              fullName: Nguyễn Văn An
      responses:
        '201':
          description: Account created; the response logs the user in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
              example: {accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI3YzFlIn0.sig, tokenType: Bearer, expiresIn: 28800, user: {id: 7c1e2a4b-5d6f-4a8b-9c0d-1e2f3a4b5c6d, email: an.nguyen@company.vn, fullName: Nguyễn Văn An, role: EMPLOYEE, createdAt: '2026-11-16T02:00:00Z'}}
        '400':
          description: '`VALIDATION_FAILED`: request shape or field validation failed (see errors[]).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {ValidationFailed: {summary: VALIDATION_FAILED, value: {type: about:blank, title: Bad Request, status: 400, detail: Request validation failed., instance: /api/v1/auth/register, code: VALIDATION_FAILED, errors: [{field: password, message: size must be between 8 and 72}]}}}
        '409':
          description: '`EMAIL_ALREADY_EXISTS`: email already registered (case-insensitive).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {EmailAlreadyExists: {summary: EMAIL_ALREADY_EXISTS, value: {type: about:blank, title: Conflict, status: 409, detail: Email is already registered., instance: /api/v1/auth/register, code: EMAIL_ALREADY_EXISTS}}}
        '500':
          description: '`INTERNAL_ERROR`: unexpected server error; no stack trace is exposed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/auth/register, code: INTERNAL_ERROR}}}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and receive a JWT
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: employee@spacebooking.local
              password: Employee@12345
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
              example: {accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMTExIn0.sig, tokenType: Bearer, expiresIn: 28800, user: {id: 11111111-1111-4111-8111-111111111111, email: employee@spacebooking.local, fullName: Trần Thị Bình, role: EMPLOYEE, createdAt: '2026-11-01T00:00:00Z'}}
        '400':
          description: '`VALIDATION_FAILED`: request shape or field validation failed (see errors[]).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {ValidationFailed: {summary: VALIDATION_FAILED, value: {type: about:blank, title: Bad Request, status: 400, detail: Request validation failed., instance: /api/v1/auth/login, code: VALIDATION_FAILED, errors: [{field: email, message: must be a well-formed email address}]}}}
        '401':
          description: '`INVALID_CREDENTIALS`: unknown email or wrong password.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InvalidCredentials: {summary: INVALID_CREDENTIALS, value: {type: about:blank, title: Unauthorized, status: 401, detail: Email or password is incorrect., instance: /api/v1/auth/login, code: INVALID_CREDENTIALS}}}
        '500':
          description: '`INTERNAL_ERROR`: unexpected server error; no stack trace is exposed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/auth/login, code: INTERNAL_ERROR}}}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user from the token
      x-roles: [EMPLOYEE, MANAGER, ADMIN]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
              example: {id: 11111111-1111-4111-8111-111111111111, email: employee@spacebooking.local, fullName: Trần Thị Bình, role: EMPLOYEE, createdAt: '2026-11-01T00:00:00Z'}
        '401':
          description: '`UNAUTHENTICATED`: missing, malformed, tampered or expired token.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {Unauthenticated: {summary: UNAUTHENTICATED, value: {type: about:blank, title: Unauthorized, status: 401, detail: Authentication is required., instance: /api/v1/auth/me, code: UNAUTHENTICATED}}}
        '500':
          description: '`INTERNAL_ERROR`: unexpected server error; no stack trace is exposed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/auth/me, code: INTERNAL_ERROR}}}
  /api/v1/rooms:
    get:
      tags: [Rooms]
      operationId: searchRooms
      summary: Search rooms (JPA Specification)
      description: |
        All filters are optional and combined with AND. `equipments` matches whole tokens and requires all of them.
        `availableFrom`/`availableTo` must be given together with `availableTo > availableFrom` and keep only rooms with no blocking booking overlapping the range.
        Sorted by name. `includeInactive=true` is ADMIN-only.
      x-roles: [EMPLOYEE, MANAGER, ADMIN]
      parameters:
        - name: minCapacity
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          example: 6
        - name: equipments
          in: query
          description: Comma-separated tokens, e.g. `tv,whiteboard`.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items:
              $ref: '#/components/schemas/EquipmentToken'
          example: [tv, whiteboard]
        - name: availableFrom
          in: query
          schema:
            type: string
            format: date-time
          example: '2026-11-17T09:00:00+07:00'
        - name: availableTo
          in: query
          schema:
            type: string
            format: date-time
          example: '2026-11-17T10:00:00+07:00'
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Matching rooms.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/RoomResponse'}}
              example: [{id: aaaaaaaa-0000-4000-8000-000000000001, name: Phòng Sen, location: Tầng 3, capacity: 6, equipments: [tv, whiteboard], requiresApproval: false, active: true}]
        '400':
          description: '`VALIDATION_FAILED`: request shape or field validation failed (see errors[]).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {ValidationFailed: {summary: VALIDATION_FAILED, value: {type: about:blank, title: Bad Request, status: 400, detail: Request validation failed., instance: /api/v1/rooms?availableFrom=2026-11-17T10:00:00%2B07:00&availableTo=2026-11-17T09:00:00%2B07:00, code: VALIDATION_FAILED, errors: [{field: availableTo, message: must be after availableFrom}]}}}
        '401':
          description: '`UNAUTHENTICATED`: missing, malformed, tampered or expired token.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {Unauthenticated: {summary: UNAUTHENTICATED, value: {type: about:blank, title: Unauthorized, status: 401, detail: Authentication is required., instance: /api/v1/rooms, code: UNAUTHENTICATED}}}
        '403':
          description: '`ACCESS_DENIED`: role not allowed, or caller is not the owner.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {AccessDenied: {summary: ACCESS_DENIED, value: {type: about:blank, title: Forbidden, status: 403, detail: Only administrators can list inactive rooms., instance: /api/v1/rooms?includeInactive=true, code: ACCESS_DENIED}}}
        '500':
          description: '`INTERNAL_ERROR`: unexpected server error; no stack trace is exposed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/rooms, code: INTERNAL_ERROR}}}
    post:
      tags: [Rooms]
      operationId: createRoom
      summary: Create a room
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomRequest'
            example:
              name: Phòng Đào
              location: Tầng 4
              capacity: 8
              equipments: [tv, video-conference]
              requiresApproval: false
      responses:
        '201':
          description: Room created.
          headers:
            Location:
              schema: {type: string}
              description: URL of the new room.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomResponse'}
              example: {id: aaaaaaaa-0000-4000-8000-000000000006, name: Phòng Đào, location: Tầng 4, capacity: 8, equipments: [tv, video-conference], requiresApproval: false, active: true}
        '400':
          description: '`VALIDATION_FAILED`: request shape or field validation failed (see errors[]).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {ValidationFailed: {summary: VALIDATION_FAILED, value: {type: about:blank, title: Bad Request, status: 400, detail: Request validation failed., instance: /api/v1/rooms, code: VALIDATION_FAILED, errors: [{field: capacity, message: must be between 1 and 1000}]}}}
        '401':
          description: '`UNAUTHENTICATED`: missing, malformed, tampered or expired token.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {Unauthenticated: {summary: UNAUTHENTICATED, value: {type: about:blank, title: Unauthorized, status: 401, detail: Authentication is required., instance: /api/v1/rooms, code: UNAUTHENTICATED}}}
        '403':
          description: '`ACCESS_DENIED`: role not allowed, or caller is not the owner.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {AccessDenied: {summary: ACCESS_DENIED, value: {type: about:blank, title: Forbidden, status: 403, detail: Your role is not allowed to perform this action., instance: /api/v1/rooms, code: ACCESS_DENIED}}}
        '409':
          description: '`ROOM_NAME_ALREADY_EXISTS`: another room has this name.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {RoomNameAlreadyExists: {summary: ROOM_NAME_ALREADY_EXISTS, value: {type: about:blank, title: Conflict, status: 409, detail: A room with this name already exists., instance: /api/v1/rooms, code: ROOM_NAME_ALREADY_EXISTS}}}
        '500':
          description: '`INTERNAL_ERROR`: unexpected server error; no stack trace is exposed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/rooms, code: INTERNAL_ERROR}}}
  /api/v1/rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Rooms]
      operationId: getRoom
      summary: Get one room
      description: Inactive rooms are 404 for non-admins.
      x-roles: [EMPLOYEE, MANAGER, ADMIN]
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomResponse'}
              example: {id: aaaaaaaa-0000-4000-8000-000000000003, name: Hội trường Bạch Đằng, location: Tầng 1, capacity: 40, equipments: [microphone, projector, speaker], requiresApproval: true, active: true}
        '400':
          description: '`VALIDATION_FAILED`: request shape or field validation failed (see errors[]).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {ValidationFailed: {summary: VALIDATION_FAILED, value: {type: about:blank, title: Bad Request, status: 400, detail: Request validation failed., instance: /api/v1/rooms/not-a-uuid, code: VALIDATION_FAILED, errors: [{field: roomId, message: must be a valid UUID}]}}}
        '401':
          description: '`UNAUTHENTICATED`: missing, malformed, tampered or expired token.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {Unauthenticated: {summary: UNAUTHENTICATED, value: {type: about:blank, title: Unauthorized, status: 401, detail: Authentication is required., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: UNAUTHENTICATED}}}
        '404':
          description: '`ROOM_NOT_FOUND`: room does not exist, or is inactive for a non-admin.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {RoomNotFound: {summary: ROOM_NOT_FOUND, value: {type: about:blank, title: Not Found, status: 404, detail: Room not found., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000009, code: ROOM_NOT_FOUND}}}
        '500':
          description: '`INTERNAL_ERROR`: unexpected server error; no stack trace is exposed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: INTERNAL_ERROR}}}
    put:
      tags: [Rooms]
      operationId: updateRoom
      summary: Replace a room's attributes
      description: Setting `active=false` applies the same guard as DELETE.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomRequest'
            example:
              name: Phòng Sen
              location: Tầng 3
              capacity: 8
              equipments: [tv, whiteboard]
              requiresApproval: false
              active: true
      responses:
        '200':
          description: Room updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomResponse'}
              example: {id: aaaaaaaa-0000-4000-8000-000000000001, name: Phòng Sen, location: Tầng 3, capacity: 8, equipments: [tv, whiteboard], requiresApproval: false, active: true}
        '400':
          description: '`VALIDATION_FAILED`: request shape or field validation failed (see errors[]).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {ValidationFailed: {summary: VALIDATION_FAILED, value: {type: about:blank, title: Bad Request, status: 400, detail: Request validation failed., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: VALIDATION_FAILED, errors: [{field: 'equipments[0]', message: 'must match "^[a-z0-9-]{1,24}$"'}]}}}
        '401':
          description: '`UNAUTHENTICATED`: missing, malformed, tampered or expired token.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {Unauthenticated: {summary: UNAUTHENTICATED, value: {type: about:blank, title: Unauthorized, status: 401, detail: Authentication is required., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: UNAUTHENTICATED}}}
        '403':
          description: '`ACCESS_DENIED`: role not allowed, or caller is not the owner.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {AccessDenied: {summary: ACCESS_DENIED, value: {type: about:blank, title: Forbidden, status: 403, detail: Your role is not allowed to perform this action., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: ACCESS_DENIED}}}
        '404':
          description: '`ROOM_NOT_FOUND`: room does not exist, or is inactive for a non-admin.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {RoomNotFound: {summary: ROOM_NOT_FOUND, value: {type: about:blank, title: Not Found, status: 404, detail: Room not found., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000009, code: ROOM_NOT_FOUND}}}
        '409':
          description: '`ROOM_NAME_ALREADY_EXISTS`: another room has this name. `ROOM_HAS_FUTURE_BOOKINGS`: room has blocking bookings ending in the future. `CONCURRENT_UPDATE`: a concurrent change won (optimistic version or lock timeout); reload and retry.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {RoomNameAlreadyExists: {summary: ROOM_NAME_ALREADY_EXISTS, value: {type: about:blank, title: Conflict, status: 409, detail: A room with this name already exists., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: ROOM_NAME_ALREADY_EXISTS}}, RoomHasFutureBookings: {summary: ROOM_HAS_FUTURE_BOOKINGS, value: {type: about:blank, title: Conflict, status: 409, detail: Room has upcoming bookings; cancel them first., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: ROOM_HAS_FUTURE_BOOKINGS}}, ConcurrentUpdate: {summary: CONCURRENT_UPDATE, value: {type: about:blank, title: Conflict, status: 409, detail: The room was changed concurrently; reload and retry., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: CONCURRENT_UPDATE}}}
        '500':
          description: '`INTERNAL_ERROR`: unexpected server error; no stack trace is exposed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: INTERNAL_ERROR}}}
    delete:
      tags: [Rooms]
      operationId: deactivateRoom
      summary: Soft-delete a room (is_active = false)
      description: Idempotent; deactivating an inactive room returns 204.
      x-roles: [ADMIN]
      responses:
        '204':
          description: Room deactivated.
        '400':
          description: '`VALIDATION_FAILED`: request shape or field validation failed (see errors[]).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {ValidationFailed: {summary: VALIDATION_FAILED, value: {type: about:blank, title: Bad Request, status: 400, detail: Request validation failed., instance: /api/v1/rooms/not-a-uuid, code: VALIDATION_FAILED, errors: [{field: roomId, message: must be a valid UUID}]}}}
        '401':
          description: '`UNAUTHENTICATED`: missing, malformed, tampered or expired token.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {Unauthenticated: {summary: UNAUTHENTICATED, value: {type: about:blank, title: Unauthorized, status: 401, detail: Authentication is required., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: UNAUTHENTICATED}}}
        '403':
          description: '`ACCESS_DENIED`: role not allowed, or caller is not the owner.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {AccessDenied: {summary: ACCESS_DENIED, value: {type: about:blank, title: Forbidden, status: 403, detail: Your role is not allowed to perform this action., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: ACCESS_DENIED}}}
        '404':
          description: '`ROOM_NOT_FOUND`: room does not exist, or is inactive for a non-admin.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {RoomNotFound: {summary: ROOM_NOT_FOUND, value: {type: about:blank, title: Not Found, status: 404, detail: Room not found., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000009, code: ROOM_NOT_FOUND}}}
        '409':
          description: '`ROOM_HAS_FUTURE_BOOKINGS`: room has blocking bookings ending in the future. `CONCURRENT_UPDATE`: a concurrent change won (optimistic version or lock timeout); reload and retry.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {RoomHasFutureBookings: {summary: ROOM_HAS_FUTURE_BOOKINGS, value: {type: about:blank, title: Conflict, status: 409, detail: Room has upcoming bookings; cancel them first., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: ROOM_HAS_FUTURE_BOOKINGS}}, ConcurrentUpdate: {summary: CONCURRENT_UPDATE, value: {type: about:blank, title: Conflict, status: 409, detail: The room was changed concurrently; reload and retry., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: CONCURRENT_UPDATE}}}
        '500':
          description: '`INTERNAL_ERROR`: unexpected server error; no stack trace is exposed.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples: {InternalError: {summary: INTERNAL_ERROR, value: {type: about:blank, title: Internal Server Error, status: 500, detail: An unexpected error occurred., instance: /api/v1/rooms/aaaaaaaa-0000-4000-8000-000000000001, code: INTERNAL_ERROR}}}
  /api/v1/bookings:
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Create a booking
      description: Status is decided by the caller's BookingPolicyStrategy (see domain.md).
      x-roles: [EMPLOYEE, MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            example:
              roomId: aaaaaaaa-0000-4000-8000-000000000001
              title: Họp kế hoạch sprint
              startTime: '2026-11-17T09:00:00+07:00'
              endTime: '2026-11-17T10:00:00+07:00'
      responses:
        '201':
          description: Booking created as PENDING or CONFIRMED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingResponse'}
              examples: {BookingConfirmed: {$ref: '#/components/examples/BookingConfirmed'}}
        '400':
          description: '`VALIDATION_FAILED`: request shape or field validation failed (see errors[]). `START_IN_PAST`: startTime is before the current minute. `DURATION_EXCEEDED`: EMPLOYEE booking longer than 120 minutes.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
