# Dev-only values. Never reuse outside local development.
spring:
  datasource:
    username: ${DB_USER:spacebooking}
    password: ${DB_PASSWORD:spacebooking}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@12345}
    manager-password: ${SEED_MANAGER_PASSWORD:Manager@12345}
    employee-password: ${SEED_EMPLOYEE_PASSWORD:Employee@12345}
