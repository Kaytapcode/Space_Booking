# E2E-only values. Never reuse outside local/CI end-to-end runs.
spring:
  datasource:
    username: ${DB_USER:spacebooking}
    password: ${DB_PASSWORD:spacebooking}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}

app:
  jwt:
    secret: ${JWT_SECRET:e2e-only-jwt-secret-change-me-0123456789abcdef}
    # Tests move the injected clock by days; a short TTL would expire tokens issued before the jump.
    ttl: ${JWT_TTL:3650d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  scheduler:
    enabled: false # e2e tests drive BookingScheduler through /test-support/run-scheduler
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@12345}
    manager-password: ${SEED_MANAGER_PASSWORD:Manager@12345}
    employee-password: ${SEED_EMPLOYEE_PASSWORD:Employee@12345}
