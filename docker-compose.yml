# Dev-only database. Credentials are intentionally trivial and must never be reused elsewhere.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: spacebooking
      POSTGRES_USER: spacebooking
      POSTGRES_PASSWORD: spacebooking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacebooking -d spacebooking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
